<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Block Code</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Block Code</h2>

<div class="container">
  <div id="left">
    <div id="grid"></div>
  </div>
  <div id="right">
    <button id="playBtn" class="button ctl-btn">Start</button>
    <br><br>
    <div class="form">
      <div class="form-row">
        <label>space</label><span>preview</span>
      </div>
      <div class="form-row">
        <label><button id="btnA" class="button">a</button></label><span>Raise 2nd note</span>
      </div>
      <div class="form-row">
        <label><button id="btnB" class="button">b</button></label><span>Lower 2nd note</span>
      </div>
      <div class="form-row">
        <label><button id="btnC" class="button">c</button></label><span>Rotate 2nd note</span>
      </div>
      <div class="form-row">
        <label><button id="btn3" class="button">3</button></label><span>3 columns</span>
      </div>
      <div class="form-row">
        <label><button id="btn4" class="button">4</button></label><span>4 columns</span>
      </div>
      <div class="form-row">
        <label><button id="btn5" class="button">5</button></label><span>5 columns</span>
      </div>
      <div class="form-row">
        <label><button id="btnI" class="button">I</button></label><span>Insert code</span>
      </div>
      <div class="form-row">
        <label><button id="btnD" class="button">D</button></label><span>Delete code</span>
      </div>
      <div class="form-row">
        <label>i</label><span>Move insert position move</span>
      </div>
      <div class="form-row">
        <label>d</label><span>Move delete position move</span>
      </div>

      <br>
      <div class="form-row">
        <label>sequence end</label><div id="row1"></div>
      </div>
      <div class="form-row">
        <label>insert position</label><div id="row2"></div>
      </div>
      <div class="form-row">
        <label>3rd note</label><div class="row3"></div>
      </div>
      <div class="form-row">
        <label>2nd note</label><div class="row3"></div>
      </div>
      <div class="form-row">
        <label>1st note</label><div class="row3"></div>
      </div>
      <div class="form-row">
        <label>delete code</label><div id="row4"></div>
      </div>
      <br>
      <div class="form-row">
        <label>2nd note</label><span id="second_offset">0</span>
      </div>

    </div>
  </div>
</div>

<canvas id="scope" width="600" height="300"></canvas>
<audio id="audioEl" playsinline></audio>

<script src="script/blockUI.js"></script>
<script src="script/sequencer.js"></script>
<script src="script/sequencerUI.js"></script>
<script src="script/sound.js"></script>
<script src="script/mixer.js"></script>
<script src="script/keyboard.js"></script>
<script src="script/main.js"></script>

</body>
</html>
